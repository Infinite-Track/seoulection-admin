spring:
  application:
    name: seoulection-admin
  mongodb:
    uri: ${MONGODB_URI:mongodb://localhost:27017/seoulection}
  # 설문 문항·선택지와 성분 카탈로그를 Postgres에 둔다.
  # 나머지 관리 대상(youtubers·videos·products)은 Mongo다 — 데이터소스가 둘인 이유.
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/seoulection}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:}
  jpa:
    hibernate:
      # ⚠️ none이어야 한다. 스키마 주인은 api-server의 Flyway migration이다.
      ddl-auto: none
    open-in-view: false
  thymeleaf:
    cache: false

server:
  port: ${SERVER_PORT:8081}

# V1 ingredient 테이블이 있는 개발 DB에서만 명시적으로 켠다. 새 V2 로컬 DB에는 아직 이
# 레거시 스키마가 없으므로, 시드가 관리자 앱의 기동 자체를 막아서는 안 된다.
admin:
  ingredient:
    seed:
      enabled: ${ADMIN_INGREDIENT_SEED_ENABLED:false}
