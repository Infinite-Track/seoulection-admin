spring:
  application:
    name: seoulection-admin
  mongodb:
    uri: ${MONGODB_URI:mongodb://localhost:27017/seoulection}
  # 설문 문항·선택지와 성분 카탈로그를 Postgres에 둔다.
  # 나머지 관리 대상(youtubers·videos·products)은 Mongo다 — 데이터소스가 둘인 이유.
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/seoulection}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:}
  jpa:
    hibernate:
      # ⚠️ none이어야 한다. 스키마 주인은 api-server의 Flyway migration이다.
      ddl-auto: none
    open-in-view: false
  thymeleaf:
    cache: false

server:
  port: ${SERVER_PORT:8081}
