<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>제품 관리 | Seoulection Admin</title>
    <style>
        :root { font-family: Pretendard, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
        * { box-sizing: border-box; }
        body { margin: 0; background: #f6f7f9; color: #202124; }
        main { width: min(1080px, calc(100% - 40px)); margin: 42px auto; }
        nav { display: flex; gap: 8px; margin-bottom: 30px; }
        nav a { padding: 10px 14px; border-radius: 8px; color: #525960; text-decoration: none; }
        nav a.active { background: #1f6feb; color: white; }
        h1 { margin-bottom: 8px; }
        .description { margin: 0 0 24px; color: #687078; }
        .card { padding: 24px; margin-bottom: 24px; background: white; border: 1px solid #e7e9ec; border-radius: 14px; }
        .form-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
        label { display: block; margin-bottom: 8px; font-weight: 700; }
        .category-field { grid-column: 1 / -1; }
        .field-label { display: block; margin-bottom: 8px; font-weight: 700; }
        .toggle-group { display: flex; flex-wrap: wrap; gap: 9px; }
        .toggle-option { margin: 0; cursor: pointer; }
        .toggle-option input { position: absolute; width: 1px; height: 1px; opacity: 0; }
        .toggle-option span { display: inline-block; padding: 10px 15px; border: 1px solid #cdd2d8; border-radius: 999px; background: white; color: #525960; font-size: 14px; }
        .toggle-option input:checked + span { border-color: #1f6feb; background: #1f6feb; color: white; }
        .toggle-option input:focus-visible + span { outline: 3px solid rgba(31, 111, 235, .25); outline-offset: 2px; }
        input { width: 100%; height: 44px; padding: 0 14px; border: 1px solid #cdd2d8; border-radius: 9px; font-size: 15px; }
        button { height: 44px; margin-top: 18px; padding: 0 20px; border: 0; border-radius: 9px; background: #1f6feb; color: white; font-weight: 700; }
        .error { margin: 7px 0 0; color: #c62828; font-size: 14px; }
        .success { padding: 12px 14px; margin-bottom: 18px; border-radius: 9px; background: #e9f7ef; color: #18733f; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 13px 12px; border-bottom: 1px solid #eceef0; text-align: left; }
        th { color: #687078; font-size: 13px; }
        td { font-size: 14px; }
        .status { display: inline-block; padding: 4px 9px; border-radius: 999px; background: #fff4cc; color: #785b00; font-size: 12px; font-weight: 700; }
        .empty { padding: 36px; color: #8a9198; text-align: center; }
        @media (max-width: 700px) { .form-grid { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
<main>
    <nav>
        <a th:href="@{/admin}">홈</a>
        <a th:href="@{/admin/youtubers}">유튜버 채널</a>
        <a th:href="@{/admin/videos}">영상</a>
        <a class="active" th:href="@{/admin/products}">제품</a>
        <a th:href="@{/admin/survey}">설문</a>
    </nav>
    <h1>제품 등록</h1>
    <p class="description">제품 기본 정보를 등록하면 분석 파이프라인이 나머지 정보를 채웁니다.</p>
    <div class="success" th:if="${successMessage}" th:text="${successMessage}"></div>

    <section class="card">
        <form th:action="@{/admin/products}" th:object="${request}" method="post">
            <div class="form-grid">
                <div>
                    <label for="name">제품명</label>
                    <input id="name" th:field="*{name}" placeholder="제품명" autocomplete="off">
                    <p class="error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></p>
                </div>
                <div>
                    <label for="brand">브랜드</label>
                    <input id="brand" th:field="*{brand}" placeholder="브랜드명" autocomplete="off">
                    <p class="error" th:if="${#fields.hasErrors('brand')}" th:errors="*{brand}"></p>
                </div>
                <div class="category-field">
                    <span class="field-label">카테고리</span>
                    <div class="toggle-group">
                        <label class="toggle-option"><input type="radio" th:field="*{category}" value="sunscreens"><span>Sunscreens</span></label>
                        <label class="toggle-option"><input type="radio" th:field="*{category}" value="toners"><span>Toners</span></label>
                        <label class="toggle-option"><input type="radio" th:field="*{category}" value="treatments"><span>Treatments</span></label>
                        <label class="toggle-option"><input type="radio" th:field="*{category}" value="moisturizers"><span>Moisturizers</span></label>
                        <label class="toggle-option"><input type="radio" th:field="*{category}" value="cleansers"><span>Cleansers</span></label>
                        <label class="toggle-option"><input type="radio" th:field="*{category}" value="face masks"><span>Face Masks</span></label>
                    </div>
                    <p class="error" th:if="${#fields.hasErrors('category')}" th:errors="*{category}"></p>
                </div>
            </div>
            <button type="submit">제품 등록</button>
        </form>
    </section>

    <section class="card">
        <h2>등록된 제품</h2>
        <table th:if="${!products.isEmpty()}">
            <thead>
            <tr><th>제품명</th><th>브랜드</th><th>카테고리</th><th>언급 수</th><th>광고 비율</th><th>상태</th></tr>
            </thead>
            <tbody>
            <tr th:each="product : ${products}">
                <td th:text="${product.name}"></td>
                <td th:text="${product.brand}"></td>
                <td th:text="${product.category}"></td>
                <td th:text="${product.mentionCount}"></td>
                <td th:text="${product.adRatio}"></td>
                <td><span class="status" th:text="${product.status}"></span></td>
            </tr>
            </tbody>
        </table>
        <p class="empty" th:if="${products.isEmpty()}">등록된 제품이 없습니다.</p>
    </section>
</main>
</body>
</html>
