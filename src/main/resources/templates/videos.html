<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>YouTube 영상 관리 | Seoulection Admin</title>
    <link rel="stylesheet" th:href="@{/css/admin.css}">
</head>
<body>
<div class="shell">
    <aside th:replace="~{fragments/sidebar :: nav(active='videos')}"></aside>
    <div class="shell-main">
        <header class="topbar">
            <div>
                <h1>YouTube 영상 관리</h1>
                <p class="description">파이프라인에서 분석할 YouTube 영상 링크를 등록합니다.</p>
            </div>
        </header>
        <main class="content">
            <div class="alert alert-success" th:if="${successMessage}" th:text="${successMessage}"></div>

            <section class="card">
                <h2>영상 등록</h2>
                <form th:action="@{/admin/videos}" th:object="${request}" method="post">
                    <label for="url">YouTube 영상 링크</label>
                    <div class="form-row">
                        <input id="url" th:field="*{url}" placeholder="https://www.youtube.com/watch?v=..." autocomplete="off">
                        <button type="submit">영상 등록</button>
                    </div>
                    <p class="error" th:if="${#fields.hasErrors('url')}" th:errors="*{url}"></p>
                </form>
            </section>

            <section class="card">
                <h2>등록된 영상</h2>
                <table th:if="${!videos.isEmpty()}">
                    <thead><tr><th>영상 ID</th><th>제목</th><th>유튜버 ID</th><th>URL</th><th>상태</th></tr></thead>
                    <tbody>
                    <tr th:each="video : ${videos}">
                        <td th:text="${video.videoId}"></td>
                        <td th:text="${video.title ?: '파이프라인 확인 전'}"
                            th:classappend="${video.title == null} ? 'pending' : ''"></td>
                        <td th:text="${video.youtuberId ?: '파이프라인 확인 전'}"
                            th:classappend="${video.youtuberId == null} ? 'pending' : ''"></td>
                        <td><a th:href="${video.url}" th:text="${video.url}" target="_blank" rel="noopener"></a></td>
                        <td><span class="badge badge-warning" th:text="${video.status}"></span></td>
                    </tr>
                    </tbody>
                </table>
                <div class="empty" th:if="${videos.isEmpty()}">
                    <span class="empty-icon">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="5" width="14" height="14" rx="2.5"/><path d="m20.5 8.5-4 2.5 4 2.5z"/></svg>
                    </span>
                    <span>등록된 영상이 없습니다.</span>
                </div>
            </section>
        </main>
    </div>
</div>
</body>
</html>
