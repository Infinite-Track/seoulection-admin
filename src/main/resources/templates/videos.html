<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>YouTube 영상 관리 | Seoulection Admin</title>
    <style>
        :root { font-family: Pretendard, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
        * { box-sizing: border-box; }
        body { margin: 0; background: #f6f7f9; color: #202124; }
        main { width: min(1080px, calc(100% - 40px)); margin: 42px auto; }
        nav { display: flex; gap: 8px; margin-bottom: 30px; }
        nav a { padding: 10px 14px; border-radius: 8px; color: #525960; text-decoration: none; }
        nav a.active { background: #1f6feb; color: white; }
        h1 { margin-bottom: 8px; }
        .description { margin: 0 0 24px; color: #687078; }
        .card { padding: 24px; margin-bottom: 24px; background: white; border: 1px solid #e7e9ec; border-radius: 14px; }
        label { display: block; margin-bottom: 10px; font-weight: 700; }
        .form-row { display: flex; gap: 10px; }
        input { width: 100%; height: 44px; padding: 0 14px; border: 1px solid #cdd2d8; border-radius: 9px; font-size: 15px; }
        button { height: 44px; padding: 0 20px; border: 0; border-radius: 9px; background: #1f6feb; color: white; font-weight: 700; }
        .error { color: #c62828; font-size: 14px; }
        .success { padding: 12px 14px; margin-bottom: 18px; border-radius: 9px; background: #e9f7ef; color: #18733f; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 13px 12px; border-bottom: 1px solid #eceef0; text-align: left; }
        th { color: #687078; font-size: 13px; }
        td { font-size: 14px; }
        td a { color: #1f6feb; text-decoration: none; }
        .status { display: inline-block; padding: 4px 9px; border-radius: 999px; background: #fff4cc; color: #785b00; font-size: 12px; font-weight: 700; }
        .pending { color: #8a9198; }
        .empty { padding: 36px; color: #8a9198; text-align: center; }
    </style>
</head>
<body>
<main>
    <nav>
        <a th:href="@{/admin}">홈</a>
        <a th:href="@{/admin/youtubers}">유튜버 채널</a>
        <a class="active" th:href="@{/admin/videos}">영상</a>
    </nav>
    <h1>YouTube 영상 등록</h1>
    <p class="description">파이프라인에서 분석할 YouTube 영상 링크를 등록합니다.</p>
    <div class="success" th:if="${successMessage}" th:text="${successMessage}"></div>

    <section class="card">
        <form th:action="@{/admin/videos}" th:object="${request}" method="post">
            <label for="url">YouTube 영상 링크</label>
            <div class="form-row">
                <input id="url" th:field="*{url}" placeholder="https://www.youtube.com/watch?v=..." autocomplete="off">
                <button type="submit">영상 등록</button>
            </div>
            <p class="error" th:if="${#fields.hasErrors('url')}" th:errors="*{url}"></p>
        </form>
    </section>

    <section class="card">
        <h2>등록된 영상</h2>
        <table th:if="${!videos.isEmpty()}">
            <thead><tr><th>영상 ID</th><th>제목</th><th>유튜버 ID</th><th>URL</th><th>상태</th></tr></thead>
            <tbody>
            <tr th:each="video : ${videos}">
                <td th:text="${video.videoId}"></td>
                <td th:text="${video.title ?: '파이프라인 확인 전'}"
                    th:classappend="${video.title == null} ? 'pending' : ''"></td>
                <td th:text="${video.youtuberId ?: '파이프라인 확인 전'}"
                    th:classappend="${video.youtuberId == null} ? 'pending' : ''"></td>
                <td><a th:href="${video.url}" th:text="${video.url}" target="_blank" rel="noopener"></a></td>
                <td><span class="status" th:text="${video.status}"></span></td>
            </tr>
            </tbody>
        </table>
        <p class="empty" th:if="${videos.isEmpty()}">등록된 영상이 없습니다.</p>
    </section>
</main>
</body>
</html>
