<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<body>
<!--
  공용 사이드바. 페이지마다 nav를 복붙하던 것을 여기 한 곳으로 모았다 —
  메뉴 항목이 늘어나도 이 파일만 고치면 된다.

  사용법: <aside th:replace="~{fragments/sidebar :: nav(active='survey')}"></aside>
  active 값은 home / youtubers / videos / products / survey 중 하나.
-->
<aside class="sidebar" th:fragment="nav(active)">
    <div class="brand">
        <span class="brand-mark">S</span>
        <div class="brand-text">
            <strong>MySeoulection</strong>
            <span>Admin</span>
        </div>
    </div>

    <div class="nav-section-label">관리</div>
    <nav class="nav-list">
        <a class="nav-item" th:classappend="${active == 'home'} ? 'is-active' : ''" th:href="@{/admin}">
            <span class="nav-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 10v9a1 1 0 0 0 1 1h4v-6h3v6h4a1 1 0 0 0 1-1v-9"/></svg>
            </span>
            <span>홈</span>
        </a>
        <a class="nav-item" th:classappend="${active == 'youtubers'} ? 'is-active' : ''" th:href="@{/admin/youtubers}">
            <span class="nav-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="5.5" width="19" height="13" rx="3.5"/><path d="M10.75 9.3v5.4l4.5-2.7z" fill="currentColor" stroke="none"/></svg>
            </span>
            <span>유튜버 채널</span>
        </a>
        <a class="nav-item" th:classappend="${active == 'videos'} ? 'is-active' : ''" th:href="@{/admin/videos}">
            <span class="nav-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="5" width="14" height="14" rx="2.5"/><path d="m20.5 8.5-4 2.5 4 2.5z"/></svg>
            </span>
            <span>영상</span>
        </a>
        <a class="nav-item" th:classappend="${active == 'products'} ? 'is-active' : ''" th:href="@{/admin/products}">
            <span class="nav-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 8 12 3.5 20.5 8 12 12.5z"/><path d="M3.5 8v9L12 21.5 20.5 17V8"/><path d="M12 12.5V21.5"/></svg>
            </span>
            <span>제품</span>
        </a>
        <a class="nav-item" th:classappend="${active == 'survey'} ? 'is-active' : ''" th:href="@{/admin/survey}">
            <span class="nav-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3.5h9l4 4v13a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1v-16a1 1 0 0 1 1-1z"/><path d="M9 12.5h6M9 16h6M9 9h2.5"/></svg>
            </span>
            <span>설문</span>
        </a>
        <a class="nav-item" th:classappend="${active == 'skin-score-policy'} ? 'is-active' : ''" th:href="@{/admin/skin-score-policy}">
            <span class="nav-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16M7 12h10M10 18h4"/><circle cx="9" cy="6" r="2" fill="currentColor"/><circle cx="15" cy="12" r="2" fill="currentColor"/><circle cx="12" cy="18" r="2" fill="currentColor"/></svg>
            </span>
            <span>피부 점수 정책</span>
        </a>
    </nav>

    <div class="sidebar-footer">MySeoulection Admin</div>
</aside>
</body>
</html>
