<!--
  제품 성분 행 편집 조각. 상세 화면과 워크플로 2단계가 함께 쓴다.
  한쪽만 고쳐 입력 규칙이 갈리는 것을 막으려고 조각으로 뺐다.
-->
<th:block th:fragment="rows(product, productIngredients, propertyDefinitions)" xmlns:th="http://www.thymeleaf.org">
        <!--
          성분별 보완 입력. 사전 매칭 결과를 먼저 보여 주고, 그 자리에서 함량과 특성을 채운다.
          매칭 실패를 오류로 다루지 않는다 — 사전에 없는 성분은 정상이고, 어드민이 사전에
          추가하면 다음 저장부터 자동으로 연결된다.
        -->
        <section class="card is-flush" th:if="${productIngredients != null && !productIngredients.isEmpty()}">
            <div class="panel-header">
                <div>
                <h2>성분별 보완<span class="count-inline" th:text="${productIngredients.size()}"></span></h2>
                <p class="card-subtitle">
                    사전 미연결
                    <strong th:text="${#lists.size(productIngredients.?[!matched()])}">0</strong>건 —
                    연결되지 않은 성분은 추천 계산에 쓰이지 않습니다.
                </p>
                </div>
                <a class="btn-ghost" href="/admin/ingredients">성분 사전</a>
            </div>

            <div class="form-section" th:each="row : ${productIngredients}">
                <form th:action="@{'/admin/products/' + ${product.id} + '/ingredients/' + ${row.id}}" method="post">
                <div class="row-head">
                    <span class="order-badge" th:text="${row.order}">1</span>
                    <strong th:text="${row.displayName()}">성분명</strong>
                    <span class="data-chip is-success" th:if="${row.matched()}"
                          th:text="'사전 연결 · ' + ${row.matchedInciName}">사전 연결</span>
                    <span class="data-chip is-warning" th:unless="${row.matched()}">사전에 없음</span>
                    <span class="raw-name" th:if="${row.matched()}" th:text="'원문: ' + ${row.rawName}"></span>
                </div>

                <div class="form-grid">
                    <div class="field">
                        <label>함량 최소</label>
                        <input type="number" step="any" name="concentrationMin" th:value="${row.concentrationMin}">
                    </div>
                    <div class="field">
                        <label>함량 최대</label>
                        <input type="number" step="any" name="concentrationMax" th:value="${row.concentrationMax}">
                    </div>
                    <div class="field">
                        <label>단위</label>
                        <input type="text" name="unit" th:value="${row.unit}" placeholder="%">
                    </div>
                    <div class="field">
                        <label>사전 성분 ID</label>
                        <input type="text" name="ingredientId" th:value="${row.ingredientId}"
                           placeholder="비워 두면 연결 없음">
                    </div>
                </div>

                <!--
                  특성은 property_definition 에 정의된 것만 입력할 수 있다. 정의를 거치게 하면
                  오타로 만들어진 유령 키가 생기지 않고, 화면이 단위까지 자동으로 안내한다.
                -->
                <div class="form-section" th:if="${propertyDefinitions != null && !propertyDefinitions.isEmpty()}">
                    <span class="field-label">이 제품에서의 특성</span>
                    <div class="form-grid">
                        <div class="field" th:each="def : ${propertyDefinitions}">
                        <label th:text="${def.displayNameKo} + (${def.valueUnit} != null ? ' (' + ${def.valueUnit} + ')' : '')">특성</label>
                        <input type="hidden" name="propertyKey" th:value="${def.propertyKey}">
                        <!-- 수치형이면 범위 두 칸, 범주형이면 텍스트 한 칸. value_type 이 그걸 정한다. -->
                        <div class="inline-pair" th:if="${def.numeric()}">
                            <input type="number" step="any" name="propertyValueMin"
                                   th:value="${row.properties.?[propertyKey == __${def.propertyKey}__].isEmpty() ? null : row.properties.^[propertyKey == __${def.propertyKey}__].valueMin}"
                                   placeholder="최소">
                            <input type="number" step="any" name="propertyValueMax"
                                   th:value="${row.properties.?[propertyKey == __${def.propertyKey}__].isEmpty() ? null : row.properties.^[propertyKey == __${def.propertyKey}__].valueMax}"
                                   placeholder="최대">
                            <input type="hidden" name="propertyValueText" value="">
                        </div>
                        <div th:unless="${def.numeric()}">
                            <input type="text" name="propertyValueText"
                                   th:value="${row.properties.?[propertyKey == __${def.propertyKey}__].isEmpty() ? null : row.properties.^[propertyKey == __${def.propertyKey}__].valueText}"
                                   th:placeholder="${def.description}">
                            <input type="hidden" name="propertyValueMin" value="">
                            <input type="hidden" name="propertyValueMax" value="">
                        </div>
                        </div>
                    </div>
                    <p class="form-help">빈 칸은 저장하지 않습니다 — 값을 지우면 그 특성이 삭제됩니다.</p>
                </div>
                <div class="empty" th:if="${propertyDefinitions == null || propertyDefinitions.isEmpty()}">
                    <span>정의된 특성이 없습니다. <a href="/admin/ingredients/properties">특성 정의</a>에서 먼저 추가하세요.</span>
                </div>

                <div class="field">
                    <label>메모</label>
                    <input type="text" name="notes" th:value="${row.notes}" placeholder="검토 근거 등">
                </div>

                <button class="btn-primary" type="submit">이 성분 저장</button>
                </form>
            </div>
        </section>
</th:block>
