<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
    <title>성분 특성 정의 | MySeoulection Admin</title>
    <link rel="stylesheet" th:href="@{/css/admin.css}">
</head>
<body>
<div class="shell">
    <aside th:replace="~{fragments/sidebar :: nav(active='ingredient-properties')}"></aside>
    <div class="shell-main">
        <header class="topbar"><div><h1>성분 특성 정의</h1><p class="description">성분별 특성 입력에 사용할 수 있는 키를 관리합니다.</p></div></header>
        <main class="content">
            <div class="alert alert-success" th:if="${successMessage}" th:text="${successMessage}"></div>
            <div class="alert alert-error" th:if="${errorMessage}" th:text="${errorMessage}"></div>
            <section class="card">
                <div class="panel-header"><div><h2>특성 정의 추가·수정</h2><p class="card-subtitle">같은 키를 입력하면 기존 정의를 수정합니다.</p></div></div>
                <form th:action="@{/admin/ingredient-properties}" method="post" class="form-grid cols-2">
                    <div><label for="propertyKey">키</label><input id="propertyKey" name="propertyKey" placeholder="MOLECULAR_WEIGHT_KDA" required></div>
                    <div><label for="displayNameKo">한글명</label><input id="displayNameKo" name="displayNameKo" placeholder="분자량" required></div>
                    <div><label for="valueType">값 유형</label><select id="valueType" name="valueType"><option>TEXT</option><option>NUMBER</option><option>BOOLEAN</option></select></div>
                    <div><label for="valueUnit">기본 단위</label><input id="valueUnit" name="valueUnit" placeholder="%, kDa 등"></div>
                    <div class="span-full"><label for="description">설명</label><input id="description" name="description" placeholder="이 특성이 무엇을 뜻하는지 설명"></div>
                    <div class="form-footer span-full"><button class="btn-primary" type="submit">정의 저장</button></div>
                </form>
            </section>
            <section class="card is-flush">
                <div class="panel-header"><div><h2>등록된 특성<span class="count-inline" th:text="${definitions.size()}"></span></h2></div></div>
                <div class="table-scroll"><table class="admin-table"><thead><tr><th>키</th><th>한글명</th><th>값 유형</th><th>단위</th><th>설명</th><th>관리</th></tr></thead>
                    <tbody><tr th:each="definition : ${definitions}"><td><code th:text="${definition.propertyKey}"></code></td><td th:text="${definition.displayNameKo}"></td><td th:text="${definition.valueType}"></td><td th:text="${definition.valueUnit ?: '-'}"></td><td th:text="${definition.description ?: '-'}"></td><td class="definition-actions"><form th:action="@{'/admin/ingredient-properties/' + ${definition.propertyKey} + '/delete'}" method="post" onsubmit="return confirm('이 특성 정의를 삭제할까요? 사용 중인 특성은 삭제할 수 없습니다.')"><button class="danger" type="submit" title="특성 정의 삭제"><span aria-hidden="true">×</span> 삭제</button></form></td></tr></tbody>
                </table></div>
            </section>
        </main>
    </div>
</div>
</body>
</html>
