<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>YouTube 채널 관리 | MySeoulection Admin</title>
    <link rel="stylesheet" th:href="@{/css/admin.css}">
</head>
<body>
<div class="shell">
    <aside th:replace="~{fragments/sidebar :: nav(active='youtubers')}"></aside>
    <div class="shell-main">
        <header class="topbar">
            <div>
                <h1>유튜버 채널 관리</h1>
                <p class="description">파이프라인이 주기적으로 확인할 YouTube 채널 링크를 등록합니다.</p>
            </div>
        </header>
        <main class="content">
            <div class="alert alert-success" th:if="${successMessage}" th:text="${successMessage}"></div>

            <section class="card">
                <h2>채널 등록</h2>
                <form th:action="@{/admin/youtubers}" th:object="${request}" method="post">
                    <div class="form-grid">
                        <div>
                            <label for="channelName">채널명</label>
                            <input id="channelName" th:field="*{channelName}" placeholder="채널명" autocomplete="off">
                            <p class="error" th:if="${#fields.hasErrors('channelName')}" th:errors="*{channelName}"></p>
                        </div>
                        <div class="span-full">
                            <label for="url">YouTube 채널 링크</label>
                            <div class="form-row">
                                <input id="url" th:field="*{url}" placeholder="https://www.youtube.com/@channel" autocomplete="off">
                            </div>
                            <p class="error" th:if="${#fields.hasErrors('url')}" th:errors="*{url}"></p>
                        </div>
                    </div>
                    <button type="submit">채널 등록</button>
                </form>
            </section>

            <section class="card">
                <h2>등록된 채널</h2>
                <table th:if="${!youtubers.isEmpty()}">
                    <thead><tr><th>채널명</th><th>채널 ID</th><th>URL</th><th>마지막 확인</th></tr></thead>
                    <tbody>
                    <tr th:each="youtuber : ${youtubers}">
                        <td th:text="${youtuber.channelName ?: '파이프라인 확인 전'}"
                            th:classappend="${youtuber.channelName == null} ? 'pending' : ''"></td>
                        <td th:text="${youtuber.channelId ?: '파이프라인 확인 전'}"
                            th:classappend="${youtuber.channelId == null} ? 'pending' : ''"></td>
                        <td><a th:href="${youtuber.url}" th:text="${youtuber.url}" target="_blank" rel="noopener"></a></td>
                        <td th:text="${youtuber.lastCheckedAt == null ? '확인 전' : #temporals.format(youtuber.lastCheckedAt, 'yyyy-MM-dd HH:mm')}"></td>
                    </tr>
                    </tbody>
                </table>
                <div class="empty" th:if="${youtubers.isEmpty()}">
                    <span class="empty-icon">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="5.5" width="19" height="13" rx="3.5"/></svg>
                    </span>
                    <span>등록된 채널이 없습니다.</span>
                </div>
            </section>
        </main>
    </div>
</div>
</body>
</html>
