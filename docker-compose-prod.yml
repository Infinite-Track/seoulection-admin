# 운영(EC2) — 어드민 전용 인스턴스.
#
# 왜 별도 인스턴스인가: 2026-09-09 에 api-server 스택에서 분리했다. 이유는 둘이다.
#   ① 메모리 — API 인스턴스가 4GB·스왑 없음이라 컨테이너 하나가 부풀면 커널이 아무나 죽인다.
#   ② 이 앱에는 인증이 없다(starter-security 미포함) — 서비스 호스트와 같은 곳에 두지 않는다.
#
# DB 는 여기 없다. API 인스턴스의 postgres·mongo 에 같은 VPC 사설 IP 로 붙는다.
#   경로: 이 인스턴스 → 192.168.x.x:5432 / :27017
#   통제: 보안 그룹(DB 쪽 SG 인바운드 소스가 이 인스턴스의 SG). 라우팅은 VPC 의 local 경로.
#
# 🔴 Mongo 에는 인증이 없다. SG 가 유일한 방어선이므로 인바운드 소스를 CIDR 로 넓히지 말 것.
#
# 사용법:
#   cp .env.example .env && vi .env
#   docker compose -f docker-compose-prod.yml pull
#   docker compose -f docker-compose-prod.yml up -d

services:
  admin-server:
    # 🔴 태그에 기본값을 두지 않는다(:?). latest 로 폴백하면 그 이름의 뜻이 계속 바뀌어
    #    "지금 뜬 게 어느 커밋인가" 에 답할 수 없고 롤백 대상을 부를 이름도 사라진다.
    #    CI 가 sha-<커밋7자리> 와 latest 를 함께 올리므로 SHA 를 쓴다.
    image: "ghcr.io/infinite-track/seoulection-admin:${ADMIN_IMAGE_TAG:?.env 에 sha-<커밋7자리> 를 지정할 것}"
    container_name: seoulection-admin-server
    restart: unless-stopped
    environment:
      # ⚠️ 컨테이너 이름이 아니라 DB 인스턴스의 사설 IP 다. 같은 compose 가 아니므로
      #    postgres/mongo 라는 이름으로는 찾을 수 없다.
      SPRING_DATASOURCE_URL: "jdbc:postgresql://${DB_HOST:?.env 에 DB 인스턴스의 사설 IP 를 지정할 것}:5432/seoulection"
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: "${POSTGRES_PASSWORD:?.env 에 API 인스턴스와 동일한 값을 지정할 것}"
      MONGODB_URI: "mongodb://${DB_HOST}:27017/seoulection"
      SERVER_PORT: 8081

      # ⚠️ 스키마 주인은 api-server 의 Flyway 다. application.yml 이 ddl-auto=none 으로 고정돼 있고
      #    여기서 덮어쓰지 않는다 — 켜면 두 앱이 같은 테이블 DDL 을 서로 밀어낸다.

      # 기능성 자동 판정(의약품안전나라 조회). 분리 전에는 api-server 저장소의 compose 가 넘겨줬다.
      # 🔴 기본을 false 로 둔다. 앱 기본값은 true 인데, 키가 없는 채로 켜져 있으면 조회가 전부
      #    FAILED 로 쌓인다(조용히 "기능성 아님" 이 되지 않도록 일부러 예외를 던지는 설계다).
      #    키를 넣는 시점에 이 값을 함께 true 로 올릴 것.
      FUNCTIONAL_SCREENING_ENABLED: ${FUNCTIONAL_SCREENING_ENABLED:-false}
      MFDS_SERVICE_KEY: ${MFDS_SERVICE_KEY:-}
      FUNCTIONAL_SCREENING_LLM: "${FUNCTIONAL_SCREENING_LLM:-false}"
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}

      # 제품 사진 업로드(제품 정보 보완). 비어 있어도 기동은 되고, 업로드 시점에 에러가 난다.
      # ⚠️ .env 에 적기만 해서는 컨테이너에 안 들어간다 — compose 는 여기 나열한 것만 넘긴다.
      #    .env 는 이 파일의 ${...} 보간에만 쓰인다.
      # 원본 자격증명은 AWS SDK 가 환경변수에서 직접 읽고, 그걸로 AWS_ROLE_ARN 을 AssumeRole 한다.
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_REGION: ${AWS_REGION:-}
      S3_BUCKET: ${S3_BUCKET:-}
      CLOUDFRONT_DOMAIN: ${CLOUDFRONT_DOMAIN:-}
      # 🔴 아래 둘은 기본값을 비우지 말 것. 빈 문자열을 넘기면 앱의 기본값이 아니라 빈 값이 쓰인다
      #    (S3_PREFIX 는 버킷 루트에 올라가고, AWS_ROLE_ARN 은 AssumeRole 이 실패한다).
      #    기본값은 ProductImageStorage 의 @Value 기본값과 맞춘다.
      S3_PREFIX: ${S3_PREFIX:-product-pictures}
      AWS_ROLE_ARN: ${AWS_ROLE_ARN:-arn:aws:iam::091974775936:role/seoulection-product-image-s3-role}

      # 🔴 힙 상한을 명시한다. Dockerfile 의 ENTRYPOINT 에 -Xmx 가 없어서, 없으면 JVM 이
      #    컨테이너 메모리의 약 1/4 을 최대 힙으로 잡는다. t3.micro(1GB) 에서는 여유가 없다.
      JAVA_TOOL_OPTIONS: "-Xmx320m"

    # 🔴 ports 없음 — 의도적이다. 이 앱에는 인증이 없어서 퍼블리시하면 URL 만 아는 누구나
    #    설문 마스터·성분 카탈로그를 수정할 수 있다. 접속은 SSH 터널로 한다:
    #      IP=$(ssh <이 인스턴스> "docker inspect -f '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' seoulection-admin-server")
    #      ssh -N -L 8081:$IP:8081 <이 인스턴스>     # 브라우저에서 http://localhost:8081
    #    인증을 붙이기 전까지 ports 를 되살리지 말 것.

    # ⚠️ 상한을 안 걸면 스왑까지 밀어내며 인스턴스 전체가 느려진다. 힙 320m + 비힙 여유.
    mem_limit: 640m

    # ⚠️ localhost 가 아니라 127.0.0.1 이다 — 컨테이너 안에서 localhost 가 ::1 로 먼저 풀리면
    #    IPv4 에만 바인딩된 서버에 connection refused 가 난다.
    # ⚠️ actuator 가 없어서 / 를 쓴다. 이 검사는 "앱이 응답하는가" 까지만 본다 —
    #    DB 가 끊겨도 통과할 수 있으니 DB 상태 판정에 쓰지 말 것.
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8081/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
